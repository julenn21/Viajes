<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis viajes</title>
<meta name="theme-color" content="#0E1B2C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1B2C; --paper:#F6F8FA; --ink:#14233A; --sun:#FFC93C; --mint:#5FD3BC; --mute:#9BB0C8;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:#E8EFF7;font-family:var(--body);line-height:1.55;min-height:100vh;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background-image:radial-gradient(1200px 500px at 85% -10%,#1B3556 0,transparent 70%)}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* PORTADA */
.hero{padding:64px 0 28px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,9vw,5.4rem);line-height:.95;letter-spacing:-.03em;max-width:12ch}
.hero p{margin-top:18px;color:var(--mute);max-width:46ch;font-size:1.05rem}
.count{display:inline-flex;align-items:baseline;gap:10px;margin-top:26px;padding:10px 18px;border:2px dashed var(--sun);border-radius:12px;
  transform:rotate(-2deg);color:var(--sun);font-family:var(--display);font-weight:800}
.count b{font-size:2rem;line-height:1}
.count span{font-weight:500;font-size:.95rem}

/* SELLOS */
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 26px;padding:34px 0 80px}
.stamp{display:block;text-decoration:none;color:var(--ink);padding:16px;
  --h:radial-gradient(circle at 7px 0,var(--bg) 5px,#0000 5.5px);
  --h2:radial-gradient(circle at 7px 8px,var(--bg) 5px,#0000 5.5px);
  --v:radial-gradient(circle at 0 7px,var(--bg) 5px,#0000 5.5px);
  --v2:radial-gradient(circle at 8px 7px,var(--bg) 5px,#0000 5.5px);
  background:var(--h) 0 0/14px 8px repeat-x,var(--h2) 0 100%/14px 8px repeat-x,
             var(--v) 0 0/8px 14px repeat-y,var(--v2) 100% 0/8px 14px repeat-y,var(--paper);
  transform:rotate(var(--r,0deg));transition:transform .25s ease}
.stamp:nth-child(3n+1){--r:-1.6deg}.stamp:nth-child(3n+2){--r:1.2deg}.stamp:nth-child(3n){--r:-.5deg}
.stamp:hover,.stamp:focus-visible{transform:rotate(0) translateY(-6px)}
.cover{aspect-ratio:4/5;display:grid;place-items:center;font-size:4.6rem;background-size:cover;background-position:center;position:relative;overflow:hidden}
.cover.has-img{font-size:0}
.cover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px #0002}
.stamp h2{font-family:var(--display);font-weight:800;font-size:1.25rem;margin-top:12px;letter-spacing:-.01em}
.stamp small{color:#4F647E;font-size:.85rem}
.drop{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*90ms + 250ms)}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(1.25) rotate(calc(var(--r,0deg) + 6deg))}to{opacity:1}}

/* PAÍS */
.country{padding:26px 0 80px}
.back{display:inline-block;margin-bottom:22px;color:var(--mute);text-decoration:none;font-weight:600}
.back:hover{color:var(--sun)}
.banner{position:relative;border-radius:22px;overflow:hidden;padding:clamp(28px,6vw,64px);min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;
  background-size:cover;background-position:center}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0E1B2CCC,#0E1B2C22 70%)}
.banner>*{position:relative}
.flag{font-size:3.4rem;line-height:1;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.banner h1{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,8vw,4.6rem);letter-spacing:-.03em;line-height:1;margin-top:10px;color:#fff}
.banner p{color:#E1EAF4;max-width:52ch;margin-top:10px}
.when{display:inline-block;margin-top:14px;background:var(--sun);color:var(--ink);font-weight:600;padding:4px 14px;border-radius:99px;font-size:.9rem;align-self:flex-start}
.gallery{margin-top:28px;background:var(--paper);border-radius:18px;padding:10px;height:72vh;min-height:420px}
.gallery iframe{width:100%;height:100%;border:0;border-radius:12px;background:#fff}
.empty{margin-top:28px;border:2px dashed #35516F;border-radius:18px;padding:44px 24px;text-align:center;color:var(--mute)}
.empty b{display:block;font-family:var(--display);font-size:1.4rem;color:#fff;margin-bottom:6px}
.open{display:inline-block;margin-top:16px;color:var(--ink);background:var(--mint);font-weight:600;text-decoration:none;padding:10px 20px;border-radius:99px}
.open:hover{background:#82E3CF}
footer{padding:0 0 40px;color:#5E7690;font-size:.85rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="wrap">
  <!-- Vista: todos los países -->
  <section id="home">
    <header class="hero">
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
      <div class="count"><b id="n">0</b><span>sellos en el pasaporte</span></div>
    </header>
    <div class="stamps" id="stamps"></div>
  </section>

  <!-- Vista: un país -->
  <section id="country" class="country" hidden>
    <a class="back" href="#">&larr; Todos los países</a>
    <div class="banner" id="banner"></div>
    <div id="media"></div>
  </section>
</main>
<footer>Hecho con cariño para guardar cada viaje</footer>

<script>
/* =====================================================
   CONFIGURACIÓN: edita solo esta parte
   -----------------------------------------------------
   id      : nombre corto sin espacios ni tildes. La web de ese país es  tuweb.com/#id
             (ese es el enlace que grabas en la pegatina NFC)
   drive   : ID de la carpeta de Google Drive (lo que va después de /folders/ en su enlace)
   portada : opcional. Ruta de una foto, por ejemplo "img/japon.jpg" (súbela junto a este archivo)
   colores : degradado de la portada si no hay foto
   ===================================================== */
const TITULO    = "Mis viajes";
const SUBTITULO = "Cada imán guarda un país. Acerca el móvil, mira las fotos y revive el viaje.";

const PAISES = [
  { id:"mexico",  nombre:"México",   flag:"🇲🇽", fecha:"", nota:"Los recuerdos de México.",   colores:["#1E9E5A","#B3262E"], portada:"", drive:"1fAos7XAfB-EaR9FjmcjflvukRyoSj8F9" },
  { id:"newyork", nombre:"New York", flag:"🗽",  fecha:"", nota:"Los recuerdos de New York.", colores:["#4C6FFF","#1A2A6C"], portada:"", drive:"1f_R1IlbNMoHd5NNE0T9j7E3jzlgCqyG5" }
];
/* ===================================================== */

const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k));
  return e;
};
const cover = p => p.portada ? `url("${p.portada}")` : `linear-gradient(145deg,${p.colores[0]},${p.colores[1]})`;

document.title = TITULO;
$("#titulo").textContent = TITULO;
$("#subtitulo").textContent = SUBTITULO;
$("#n").textContent = PAISES.length;

// Sellos
PAISES.forEach((p, i) => {
  const c = el("div", { className: "cover" + (p.portada ? " has-img" : ""), textContent: p.portada ? "" : p.flag });
  c.style.backgroundImage = cover(p);
  const a = el("a", { className: "stamp drop", href: "#" + p.id }, c, el("h2", { textContent: p.nombre }), el("small", { textContent: p.fecha }));
  a.style.setProperty("--i", i);
  a.setAttribute("aria-label", "Ver recuerdos de " + p.nombre);
  $("#stamps").append(a);
});

// Rutas
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const p = PAISES.find(x => x.id === id);
  $("#home").hidden = !!p;
  $("#country").hidden = !p;
  window.scrollTo(0, 0);
  if (!p){ document.title = TITULO; return; }
  document.title = p.nombre + " · " + TITULO;

  const b = $("#banner");
  b.style.backgroundImage = cover(p);
  b.replaceChildren(
    el("div", { className: "flag", textContent: p.flag }),
    el("h1", { textContent: p.nombre }),
    el("p", { textContent: p.nota })
  );
  if (p.fecha) b.append(el("span", { className: "when", textContent: p.fecha }));

  const m = $("#media");
  if (p.drive){
    const g = el("div", { className: "gallery" });
    g.append(el("iframe", {
      src: "https://drive.google.com/embeddedfolderview?id=" + encodeURIComponent(p.drive) + "#grid",
      title: "Fotos y vídeos de " + p.nombre, loading: "lazy"
    }));
    const open = el("a", { className: "open", href: "https://drive.google.com/drive/folders/" + encodeURIComponent(p.drive),
      target: "_blank", rel: "noopener", textContent: "Abrir el álbum completo" });
    m.replaceChildren(g, el("div", { style: "text-align:center" }, open));
  } else {
    m.replaceChildren(el("div", { className: "empty" },
      el("b", { textContent: "Aquí irán los recuerdos de " + p.nombre }),
      "Sube fotos y vídeos a la carpeta de este país y aparecerán en esta página."));
  }
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
